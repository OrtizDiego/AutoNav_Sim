  walk_speed: 0.7
  walk_speed_jitter: 0.1
  run_speed: 2.5
  exhausted_speed: 0.5
  accel: 2.0
  decel: 3.0
  walk_max_yaw_rate: 1.5
  run_max_yaw_rate: 1.0
  max_run_secs: 3.5
