security_guard:
  hsv_red_lower1: [0, 100, 100]
  hsv_red_upper1: [10, 255, 255]
  hsv_red_lower2: [160, 100, 100]
  hsv_red_upper2: [180, 255, 255]
  angular_gain: 0.01
  linear_speed: 0.2
  max_angular_speed: 0.5
  min_contour_area: 500.0
  stop_distance_area: 35000.0
