# Shared parameters for the behaviour nodes of every scenario.
#
# Standard ROS 2 params-file layout (node_name: ros__parameters: {...}) so it
# can be passed directly to launch `parameters=[...]` or `--params-file`.
# Every value's type must match the node's declare_parameter() default
# (e.g. 300.0 not 300 for a double); test_behavior_params.py enforces this.
# Launch files add per-scenario overrides on top (sensor_fusion mode,
# person_controller map_yaml).

# --- ball-sim -------------------------------------------------------------

ball_controller:
  ros__parameters:
    autopilot: true
    # Figure-eight checked against maps/my_map by test_ball.py
    path_center: [2.5, -2.5]
    path_half_width: 3.5
    path_half_height: 1.25
    cruise_speed: 0.35
    flee_speed: 0.8
    flee_distance: 1.8
    wait_distance: 4.5
    max_speed: 1.0
    accel: 1.5
    teleop_timeout: 1.0
    update_rate_hz: 30.0

ball_chaser:
  ros__parameters:
    desired_distance: 1.0
    deadband: 0.1
    k_lin: 0.6
    k_yaw: 1.8
    max_linear_speed: 0.6
    max_back_speed: 0.15
    max_angular_speed: 1.5
    safety_distance: 0.35
    target_timeout: 0.5
    search_secs: 20.0
    search_angular_speed: 0.6

# --- shared perception (ball-sim: mode hsv, yolo-sim/person-sim: person) ---

sensor_fusion:
  ros__parameters:
    mode: hsv
    hsv_red_lower1: [0, 100, 100]
    hsv_red_upper1: [10, 255, 255]
    hsv_red_lower2: [160, 100, 100]
    hsv_red_upper2: [180, 255, 255]
    # px^2 at 320x240 (was 300 at 640x480: same apparent ball size)
    min_contour_area: 75.0
    range_min: 0.3
    range_max: 12.0
    # Must match camera.xacro (test_urdf.py checks)
    image_width: 320
    image_height: 240
    horizontal_fov: 1.089
    camera_height: 0.103
    person_height: 1.72

person_tracker:
  ros__parameters:
    model_path: /root/models/yolov8n.onnx
    confidence_threshold: 0.4
    nms_iou_threshold: 0.45
    redetect_every: 10
    redetect_period: 0.5
    max_yolo_misses: 2
    max_coast_frames: 10
    publish_debug_image: true
    # Log frames/s and mean YOLO / tracker time every N wall seconds (0 = off)
    stats_period: 10.0
    # OpenCV tracker between detections: kcf (fast), csrt (tighter, ~10x
    # slower on the CPU) or mil; falls back to the others if missing.
    tracker: kcf
    # YOLO in a worker thread: every frame is tracked and published without
    # waiting for inference. false = inline, as before Phase 1.
    async_detection: true
    # onnxruntime threads per inference; 0 = its default (every core, which
    # competes with gzserver). Try 2 if the real-time factor drops with YOLO.
    inference_threads: 0

# --- person-sim -----------------------------------------------------------

target_tracker:
  ros__parameters:
    frame_id: odom
    # Constant-velocity EKF: white-noise acceleration (m/s^2). The pedestrian
    # accelerates at 2 m/s^2 and sprints at 2.5 m/s.
    accel_noise: 1.5
    # Camera (/target) noise: bearing rad, range m + fraction of the range
    bearing_sigma: 0.04
    range_sigma: 0.15
    range_sigma_rel: 0.05
    speed_sigma: 1.0
    # Camera hits before a track is confirmed (published, followed)
    confirm_hits: 3
    # Simulation seconds without an accepted measurement before a track is
    # dropped (tentative / confirmed)
    tentative_timeout: 0.5
    lost_timeout: 1.5
    # Gated-out ranged detections in a row that restart the track elsewhere
    max_outliers: 3
    # Measurements older than the filter by more than this are dropped
    max_lag: 1.0
    # Person-sized lidar clusters update a confirmed track for up to
    # lidar_coast_secs after the last camera hit
    use_lidar: true
    lidar_sigma: 0.12
    lidar_coast_secs: 1.5
    # laser_frame is 0.064 m behind base_link (robot_core.xacro)
    lidar_offset_x: -0.064
    cluster_range_max: 8.0
    cluster_jump: 0.1
    cluster_jump_rel: 0.03
    cluster_merge_distance: 0.5
    cluster_max_width: 0.8
    prediction_horizon: 1.0
    publish_rate: 10.0

person_controller:
  ros__parameters:
    walk_speed: 0.7
    walk_speed_jitter: 0.1
    run_speed: 2.5
    exhausted_speed: 0.5
    accel: 2.0
    decel: 3.0
    walk_max_yaw_rate: 1.5
    run_max_yaw_rate: 1.0
    max_run_secs: 3.5
    recovery_secs: 8.0
    resume_stamina: 0.6
    min_clearance: 0.5
    waypoint_clearance: 1.0
    calm_down_secs: 4.0
    notice_radius: 7.0
    update_rate_hz: 20.0

security_guard_bt:
  ros__parameters:
    # Flat [x0, y0, x1, y1, ...] in the map frame — ROS 2 parameters cannot
    # hold nested lists.
    waypoints: [3.28, 6.85, -0.92, 6.85, 5.13, -2.45, 0.23, -2.55, -4.52, 8.60, 0.0, 0.0]
    waypoint_dwell_secs: 2.0
    # Follow target_tracker's /intruder/track (odom-frame track with
    # velocity, extrapolated to now for at most track_max_predict s);
    # false = sensor_fusion's /target, static between detections.
    use_track: true
    track_max_predict: 1.0
    # Simulation seconds without a detection before the intruder counts as
    # lost. The target is anchored in the odom frame (latency compensated),
    # so following through a short tracker dropout is safe and avoids
    # flapping between IntruderProtocol and SearchProtocol.
    target_timeout: 1.0
    search_secs: 6.0
    search_angular_speed: 0.6
    # 2.5 m keeps the person's torso in view: the camera is ~0.10 m off the
    # ground with a +/-24 deg vertical FOV, so closer than ~1.5 m it sees
    # only the legs and YOLO becomes unreliable.
    desired_distance: 2.5
    deadband: 0.15
    k_lin: 0.8
    k_yaw: 1.5
    max_linear_speed: 1.0
    max_back_speed: 0.2
    max_angular_speed: 1.5
    safety_distance: 0.6

system_monitor:
  ros__parameters:
    scan_timeout: 2.0
    camera_timeout: 2.0
    health_publish_rate: 1.0
