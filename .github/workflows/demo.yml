name: Web demo

# The browser demo (demo/): tests the robot software as the page runs it,
# builds the static site, checks it in a headless browser and, on main,
# publishes it to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches: [ main ]
    paths:
      - 'demo/**'
      - 'src/my_bot/launch/scenario.launch.py'
      - 'src/my_bot/my_bot/**'
      - 'src/my_bot/config/**'
      - 'src/my_bot/maps/**'
      - '.github/workflows/demo.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'demo/**'
      - 'src/my_bot/launch/scenario.launch.py'
      - 'src/my_bot/my_bot/**'
      - 'src/my_bot/config/**'
      - 'src/my_bot/maps/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: Playwright installs Chromium only on the Ubuntu releases it
    # supports, and ubuntu-latest moved to 26.04, which 1.56 does not.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the robot software on the fake ROS layer
        run: |
          pip install numpy opencv-python-headless pyyaml py_trees==2.6.0 pytest
          python -m pytest demo/test -q
          # the replay exporter (stub ROS from the package's conftest)
          python -m pytest src/my_bot/test/test_replay_export.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Build the site
        working-directory: demo
        run: |
          npm ci
          python build.py

      - name: Browser smoke test (Pyodide from the CDN)
        working-directory: demo
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          # A copy of the site plus a synthetic recorded run, so the replay
          # player is tested whether or not demo/replays has real ones
          (cd test && python fake_replay.py "$RUNNER_TEMP/synthetic/synthetic" 40)
          python build.py --out _site_test --replays replays --replays "$RUNNER_TEMP/synthetic"
          node test/browser_smoke.js _site_test

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
