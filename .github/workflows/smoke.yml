name: Headless smoke test

# Phase 5b: the whole person-sim stack (Gazebo, Nav2, YOLO, fusion, tracker,
# guard) on a GitHub runner, scored by src/smoke_test.sh. Slow (CPU
# rendering, well below real time), so it runs on pushes to main, on PRs
# that touch the simulation, weekly, and on demand, not on every PR.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/smoke.yml'
      - 'src/smoke_test.sh'
      - 'src/person_actor_plugin/**'
      - 'src/my_bot/launch/**'
      - 'src/my_bot/worlds/**'
      - 'src/my_bot/urdf/**'
      - 'src/my_bot/config/**'
      - 'src/my_bot/my_bot/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario from config/scenarios.yaml
        default: smoke

env:
  # Same export as the Dockerfile's yolo_export stage
  ULTRALYTICS_VERSION: '8.4.172'

jobs:
  yolo-model:
    runs-on: ubuntu-latest
    steps:
      - name: Cached model
        id: cache
        uses: actions/cache@v4
        with:
          path: yolov8n.onnx
          key: yolov8n-320-opset12-ultralytics-${{ env.ULTRALYTICS_VERSION }}

      - name: Export YOLOv8n at 320 px
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "ultralytics==${ULTRALYTICS_VERSION}" onnx
          yolo export model=yolov8n.pt format=onnx imgsz=320 opset=12
          python3 -c "import onnx; onnx.checker.check_model('yolov8n.onnx')"

      - uses: actions/upload-artifact@v4
        with:
          name: yolov8n-onnx
          path: yolov8n.onnx
          retention-days: 1

  smoke:
    needs: yolo-model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:humble-desktop-full
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ROS_DOMAIN_ID: '42'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yolov8n-onnx
          path: /root/models

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-py-trees-ros \
            xvfb
          pip3 install "numpy<2.0" onnxruntime py_trees
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      # iscas_museum (model:// in the worlds) is not in the repo: gzserver
      # downloads it from Gazebo's model database on first use, as in the
      # dev container. Cached so later runs neither wait nor depend on it.
      - name: Cached Gazebo models
        uses: actions/cache@v4
        with:
          path: ~/.gazebo/models
          key: gazebo-models-${{ hashFiles('src/my_bot/worlds/*.world') }}
          restore-keys: gazebo-models-

      - name: Build
        timeout-minutes: 10
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-up-to my_bot

      - name: Smoke test
        timeout-minutes: 40
        shell: bash
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke
          SMOKE_WALL_TIMEOUT: '2100'
          SCENARIO: ${{ github.event.inputs.scenario || 'smoke' }}
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          bash src/smoke_test.sh "$SCENARIO"

      - name: Upload report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke/
