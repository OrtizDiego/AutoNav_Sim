name: Headless smoke test

# Phase 5b: the whole person-sim stack (Gazebo, Nav2, YOLO, fusion, tracker,
# guard) on a GitHub runner, scored by src/smoke_test.sh. Slow (CPU
# rendering), so it runs on pushes to main, on PRs that touch the
# simulation, weekly, and on demand, not on every PR.
#
# Phase 7: the scripted scenarios (walk_in, sprint, hide, crossing) run next
# to the smoke test, one runner each (a runner holds a real-time factor of
# about 0.8). Each must pass the smoke floor (completed, detected, alert);
# their targets are reported, not enforced, in the summary job's table.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/smoke.yml'
      - 'src/smoke_test.sh'
      - 'src/person_actor_plugin/**'
      - 'src/my_bot/launch/**'
      - 'src/my_bot/worlds/**'
      - 'src/my_bot/urdf/**'
      - 'src/my_bot/config/**'
      - 'src/my_bot/my_bot/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario from config/scenarios.yaml, or all
        default: smoke

env:
  # Same export as the Dockerfile's yolo_export stage
  ULTRALYTICS_VERSION: '8.4.172'

jobs:
  yolo-model:
    runs-on: ubuntu-latest
    steps:
      - name: Cached model
        id: cache
        uses: actions/cache@v4
        with:
          path: yolov8n.onnx
          key: yolov8n-320-opset12-ultralytics-${{ env.ULTRALYTICS_VERSION }}

      - name: Export YOLOv8n at 320 px
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "ultralytics==${ULTRALYTICS_VERSION}" onnx
          yolo export model=yolov8n.pt format=onnx imgsz=320 opset=12
          python3 -c "import onnx; onnx.checker.check_model('yolov8n.onnx')"

      - uses: actions/upload-artifact@v4
        with:
          name: yolov8n-onnx
          path: yolov8n.onnx
          retention-days: 1

  smoke:
    needs: yolo-model
    name: ${{ matrix.scenario == 'smoke' && 'smoke' || format('scenario {0}', matrix.scenario) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:humble-desktop-full
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ROS_DOMAIN_ID: '42'
    strategy:
      fail-fast: false
      matrix:
        # A dispatch runs the scenario it names (all = every one)
        scenario: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.scenario == 'all') && '["smoke", "walk_in", "sprint", "hide", "crossing"]' || format('["{0}"]', inputs.scenario)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: yolov8n-onnx
          path: /root/models

      - name: Install dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-py-trees-ros \
            xvfb
          pip3 install "numpy<2.0" onnxruntime py_trees
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        timeout-minutes: 10
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --packages-up-to my_bot

      - name: Run ${{ matrix.scenario }}
        timeout-minutes: 40
        shell: bash
        env:
          SMOKE_OUT: ${{ github.workspace }}/smoke
          SMOKE_WALL_TIMEOUT: '2100'
          # smoke is short; the scenarios get the evaluator's own 600 s
          SMOKE_SIM_TIMEOUT: ${{ matrix.scenario == 'smoke' && '300' || '600' }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          bash src/smoke_test.sh "$SCENARIO"

      - name: Upload report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scenario == 'smoke' && 'smoke-report' || format('report-{0}', matrix.scenario) }}
          path: smoke/

  summary:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: '*report*'

      - name: Scenario table
        shell: bash
        env:
          PYTHONPATH: src/my_bot
        run: |
          shopt -s nullglob
          reports=()
          for dir in reports/*report*/; do
              name=$(basename "$dir"); name=${name#report-}; name=${name%-report}
              mkdir -p "named/$name" && cp -r "$dir". "named/$name/"
              reports+=("named/$name/report.json")
          done
          [ ${#reports[@]} -gt 0 ] || { echo 'No reports.' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 -m my_bot.scenario_summary "${reports[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
